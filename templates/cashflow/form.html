{% extends 'base.html' %}{% block title %}{{ 'Edit' if invoice else 'New' }} Invoice · CashFlow{% endblock %}{% block content %}<div class="section-row"><div><div class="eyebrow">CASHFLOW</div><h1>{{ 'Edit Invoice' if invoice else 'New Invoice' }}</h1></div></div><form class="card" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-row"><div style="flex:1"><label>Invoice #</label><input required name="invoice_number" value="{{ invoice.invoice_number if invoice else '' }}"></div><div style="flex:1"><label>Project</label><select name="project_id"><option value="">Select project</option>{% for p in projects %}<option value="{{ p.id }}" {% if invoice and invoice.project_id==p.id %}selected{% endif %}>{{ p.name }}</option>{% endfor %}</select></div></div><label>Client</label><input name="client" value="{{ invoice.client if invoice else '' }}" placeholder="Auto-fills from project when blank"><div class="form-row"><div style="flex:1"><label>Invoice Date</label><input type="date" name="invoice_date" value="{{ invoice.invoice_date if invoice else '' }}"></div><div style="flex:1"><label>Due Date</label><input type="date" name="due_date" value="{{ invoice.due_date if invoice else '' }}"></div></div><div class="form-row"><div style="flex:1"><label>Invoice Amount</label><input type="number" min="0" step="0.01" name="amount" required value="{{ invoice.amount if invoice else '' }}"></div><div style="flex:1"><label>Retainage</label><input type="number" min="0" step="0.01" name="retainage" value="{{ invoice.retainage if invoice else '0' }}"></div><div style="flex:1"><label>Workflow Status</label><select name="status"><option {% if not invoice or invoice.status=='To Invoice' %}selected{% endif %}>To Invoice</option><option {% if invoice and invoice.status=='Invoiced' %}selected{% endif %}>Invoiced</option></select></div></div><label>Description / Billing Period</label><textarea name="description" rows="4">{{ invoice.description if invoice else '' }}</textarea><div style="margin-top:20px"><button class="btn btn-gold">Save Invoice</button> <a class="btn" href="{{ url_for('cashflow_dashboard') }}">Cancel</a></div></form>{% endblock %}
