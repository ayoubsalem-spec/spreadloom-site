{% extends "base.html" %}
{% block content %}
<h1>Team</h1>
<p class="sub">Everyone who has signed up for BuildIQ.</p>

<div class="card" style="padding:0; overflow:hidden;">
    <table style="margin:0;">
        <tr><th>Name</th><th>Email</th><th>Signed Up</th><th></th></tr>
        {% for u in users %}
        <tr>
            <td>{{ u['name'] or '\u2014' }}</td>
            <td>{{ u['email'] }}</td>
            <td>{{ u['created_at'][:10] if u['created_at'] else '\u2014' }}</td>
            <td>
                <div style="display:flex; gap:8px;">
                    <a href="{{ url_for('admin_user_permissions', user_id=u['id']) }}" class="btn btn-sm">Permissions</a>
                    <form method="POST" action="{{ url_for('delete_team_member', user_id=u['id']) }}" style="margin:0;"
                          onsubmit="return confirm('Remove ' + '{{ u['email'] }}' + '? They will need to sign up again from scratch.');">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <button type="submit" class="btn btn-sm" style="color:var(--red); border-color:var(--red);">Remove (let them re-signup)</button>
                    </form>
                </div>
            </td>
        </tr>
        {% endfor %}
    </table>
</div>
{% endblock %}
