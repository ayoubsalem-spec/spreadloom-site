{% extends "inventory/base.html" %}
{% block content %}
<div style="background:linear-gradient(135deg, var(--gold), var(--gold-dim)); border-radius:12px; padding:40px 36px; margin-bottom:24px;">
    <h1 style="color:var(--navy); font-size:28px; margin-bottom:10px;">SitePulse</h1>
    <p style="color:var(--navy); opacity:0.85; font-size:14.5px; max-width:520px; line-height:1.6; margin-bottom:22px;">
        Stay on top of materials from order to delivery. Track inventory, place material and concrete orders,
        monitor deliveries, and generate reports &mdash; all in one place.
    </p>
    <a href="{{ url_for('inventory_new_concrete') }}"
       style="display:inline-block; background:var(--navy); color:var(--gold-light); font-weight:700;
              font-size:13px; letter-spacing:0.5px; padding:12px 22px; border-radius:7px; text-decoration:none;">
        REQUEST CONCRETE
    </a>
</div>

<div style="display:flex; flex-direction:column; gap:14px; max-width:480px;">
    <a href="{{ url_for('inventory_new_material') }}" class="hub-btn">REQUEST MATERIAL</a>
    <a href="{{ url_for('inventory_new_purchase') }}" class="hub-btn">REQUEST PURCHASE</a>
</div>

<style>
    .hub-btn {
        display:flex; align-items:center; justify-content:center;
        background:var(--navy-card); border:1.5px solid var(--gold-dim); color:var(--gold-light);
        font-weight:700; font-size:13px; letter-spacing:0.5px; text-decoration:none;
        padding:18px 16px; border-radius:9px; text-align:center;
    }
    .hub-btn:hover { background:var(--navy-light); border-color:var(--gold); color:var(--gold-light); }
</style>
{% endblock %}
