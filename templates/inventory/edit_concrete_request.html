{% extends "inventory/base.html" %}
{% block content %}
<h1>Edit Concrete Request</h1>
<p class="sub">Concrete Checklist Form</p>
<div class="card">
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <h3 style="font-size:15px; color:var(--gold); margin-bottom:6px;">Project Info</h3>
        <label>Project</label><input type="text" name="project" value="{{ r['project'] }}" required autofocus>
        <label>Job Site Address</label><input type="text" name="job_site_address" value="{{ r['job_site_address'] or '' }}" data-remember="job_site_address">
        <label>Description of Area to Pour</label><input type="text" name="area_description" value="{{ r['area_description'] or '' }}">

        <h3 style="font-size:15px; color:var(--gold); margin:20px 0 6px;">Concrete Details</h3>
        <div class="form-row">
            <div style="flex:1;"><label>Date of Pour</label><input type="date" name="pour_date" value="{{ r['pour_date'] }}" required></div>
            <div style="flex:1;"><label>Time of Pour</label><input type="time" name="pour_time" id="pour_time" value="{{ r['pour_time'] or '' }}"></div>
        </div>
        <div class="form-row">
            <div style="flex:1;"><label>Mix Design (PSI)</label><input type="text" name="mix_design_psi" value="{{ r['mix_design_psi'] or '' }}"></div>
            <div style="flex:1;"><label>Mix Slump</label><input type="text" name="mix_slump" value="{{ r['mix_slump'] or '' }}"></div>
        </div>
        <div class="form-row">
            <div style="flex:1;"><label>Concrete Amount</label><input type="text" name="concrete_amount" value="{{ r['concrete_amount'] or '' }}"></div>
            <div style="flex:1;"><label>Spacing Between Trucks</label><input type="text" name="truck_spacing" value="{{ r['truck_spacing'] or '' }}"></div>
        </div>
        <div class="form-row">
            <div style="flex:1;">
                <label>Pump Type</label>
                <select name="pump_type" id="pump_type">
                    <option value="" {{ 'selected' if not r['pump_type'] }}>None</option>
                    <option value="Ground Pump" {{ 'selected' if r['pump_type'] == 'Ground Pump' }}>Ground Pump</option>
                    <option value="Overhead Pump" {{ 'selected' if r['pump_type'] == 'Overhead Pump' }}>Overhead Pump</option>
                </select>
            </div>
            <div style="flex:1;" id="pump_size_wrap"><label>Pump Size</label><input type="text" name="pump_size" id="pump_size" value="{{ r['pump_size'] or '' }}"></div>
            <div style="flex:1;" id="pump_arrival_wrap"><label>Pump Arrival Time</label><input type="time" name="pump_arrival_time" id="pump_arrival_time" value="{{ r['pump_arrival_time'] or '' }}"></div>
        </div>
        <div class="form-row">
            <div style="flex:1;"><label>Lab (same time with Concrete)</label>
                <select name="lab_required" id="lab_required">
                    <option value="No" {{ 'selected' if r['lab_required'] != 'Yes' }}>No</option>
                    <option value="Yes" {{ 'selected' if r['lab_required'] == 'Yes' }}>Yes</option>
                </select>
            </div>
            <div style="flex:1;" id="lab_time_wrap"><label>Time</label><input type="time" name="lab_time" id="lab_time" value="{{ r['lab_time'] or '' }}"></div>
        </div>
        <div class="form-row">
            <div style="flex:1;"><label>Drilling Company (if required)</label>
                <select name="drilling_required" id="drilling_required">
                    <option value="No" {{ 'selected' if r['drilling_required'] != 'Yes' }}>No</option>
                    <option value="Yes" {{ 'selected' if r['drilling_required'] == 'Yes' }}>Yes</option>
                </select>
            </div>
            <div style="flex:1;" id="drilling_time_wrap"><label>Time</label><input type="time" name="drilling_time" id="drilling_time" value="{{ r['drilling_time'] or '' }}"></div>
        </div>
        <style>
            #lab_time_wrap, #drilling_time_wrap, #pump_size_wrap, #pump_arrival_wrap { display: none; }
            #lab_time_wrap.show, #drilling_time_wrap.show, #pump_size_wrap.show, #pump_arrival_wrap.show { display: block; }
        </style>
        <h3 style="font-size:15px; color:var(--gold); margin:20px 0 6px;">Requested By</h3>
        <p class="sub" style="margin-bottom:14px;">{{ r['requested_by'] or '\u2014' }} (original requester &mdash; unchanged on edit)</p>

        <button type="submit" class="btn btn-gold" style="margin-top:16px;">Save Changes</button>
    </form>
</div>
<script>
    (function () {
        function minusOneHour(hhmm) {
            var parts = hhmm.split(':');
            var d = new Date(2000, 0, 1, parseInt(parts[0], 10), parseInt(parts[1], 10));
            d.setHours(d.getHours() - 1);
            return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
        }
        var pourTime = document.getElementById('pour_time');
        var pumpArrival = document.getElementById('pump_arrival_time');
        var drillingTime = document.getElementById('drilling_time');
        var labTime = document.getElementById('lab_time');
        if (!pourTime) return;
        pourTime.addEventListener('change', function () {
            if (!pourTime.value) return;
            if (pumpArrival && !pumpArrival.value) pumpArrival.value = minusOneHour(pourTime.value);
            if (drillingTime && !drillingTime.value) drillingTime.value = minusOneHour(pourTime.value);
            if (labTime && !labTime.value) labTime.value = pourTime.value;
        });
    })();

    // Show the Time field only when its Lab / Drilling select is "Yes".
    (function () {
        function wireToggle(selectId, wrapId) {
            var select = document.getElementById(selectId);
            var wrap = document.getElementById(wrapId);
            if (!select || !wrap) return;
            function sync() { wrap.classList.toggle('show', select.value === 'Yes'); }
            select.addEventListener('change', sync);
            sync();
        }
        wireToggle('lab_required', 'lab_time_wrap');
        wireToggle('drilling_required', 'drilling_time_wrap');
    })();

    // Pump Size / Pump Arrival Time only show (and are only required) when
    // an actual pump is selected -- "None" shouldn't show or force a time.
    (function () {
        var pumpType = document.getElementById('pump_type');
        var pumpSize = document.getElementById('pump_size');
        var pumpArrival = document.getElementById('pump_arrival_time');
        var sizeWrap = document.getElementById('pump_size_wrap');
        var arrivalWrap = document.getElementById('pump_arrival_wrap');
        if (!pumpType) return;
        function sync() {
            var needsPump = pumpType.value === 'Ground Pump' || pumpType.value === 'Overhead Pump';
            if (pumpSize) pumpSize.required = needsPump;
            if (pumpArrival) pumpArrival.required = needsPump;
            if (sizeWrap) sizeWrap.classList.toggle('show', needsPump);
            if (arrivalWrap) arrivalWrap.classList.toggle('show', needsPump);
            if (!needsPump) {
                if (pumpSize) pumpSize.value = '';
                if (pumpArrival) pumpArrival.value = '';
            }
        }
        pumpType.addEventListener('change', sync);
        sync();
    })();
</script>
{% endblock %}
