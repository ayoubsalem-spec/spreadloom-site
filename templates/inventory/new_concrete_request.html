{% extends "inventory/base.html" %}
{% block content %}
<h1>Concrete Request Form</h1>
<p class="sub">Concrete Checklist Form</p>
<div class="card">
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <h3 style="font-size:15px; color:var(--gold); margin-bottom:6px;">Project Info</h3>
        <label>Project</label><input type="text" name="project" required autofocus>
        <label>Job Site Address</label><input type="text" name="job_site_address" data-remember="job_site_address">
        <label>Description of Area to Pour</label><input type="text" name="area_description">

        <h3 style="font-size:15px; color:var(--gold); margin:20px 0 6px;">Concrete Details</h3>
        <div class="form-row">
            <div style="flex:1;"><label>Date of Pour</label><input type="date" name="pour_date" value="{{ today }}" required></div>
            <div style="flex:1;"><label>Time of Pour</label><input type="time" name="pour_time"></div>
        </div>
        <div class="form-row">
            <div style="flex:1;"><label>Mix Design (PSI)</label><input type="text" name="mix_design_psi"></div>
            <div style="flex:1;"><label>Mix Slump</label><input type="text" name="mix_slump"></div>
        </div>
        <div class="form-row">
            <div style="flex:1;"><label>Concrete Amount</label><input type="text" name="concrete_amount"></div>
            <div style="flex:1;"><label>Spacing Between Trucks</label><input type="text" name="truck_spacing"></div>
        </div>
        <div class="form-row">
            <div style="flex:1;"><label>Pump Size (if required)</label><input type="text" name="pump_size"></div>
            <div style="flex:1;"><label>Pump Arrival Time</label><input type="text" name="pump_arrival_time"></div>
        </div>
        <div class="form-row">
            <div style="flex:1;"><label>Lab (same time with Concrete)</label>
                <select name="lab_required"><option value="No">No</option><option value="Yes">Yes</option></select>
            </div>
            <div style="flex:1;"><label>If yes, Time</label><input type="time" name="lab_time"></div>
        </div>
        <div class="form-row">
            <div style="flex:1;"><label>Drilling Company (if required)</label>
                <select name="drilling_required"><option value="No">No</option><option value="Yes">Yes</option></select>
            </div>
            <div style="flex:1;"><label>If yes, Time</label><input type="time" name="drilling_time"></div>
        </div>

        <h3 style="font-size:15px; color:var(--gold); margin:20px 0 6px;">Requested By</h3>
        <p class="sub" style="margin-bottom:14px;">Logged in as: <strong style="color:var(--text);">{{ current_user.name or current_user.email }}</strong></p>
        <div class="form-row">
            <div style="flex:1;"><label>Date</label><input type="date" name="requested_date" value="{{ today }}"></div>
        </div>
        <h3 style="font-size:15px; color:var(--gold); margin:20px 0 6px;">Ordered By</h3>
        <div class="form-row">
            <div style="flex:1;"><label>Name</label><input type="text" name="ordered_by"></div>
            <div style="flex:1;"><label>Date</label><input type="date" name="ordered_date"></div>
        </div>
        <button type="submit" class="btn btn-gold" style="margin-top:16px;">Submit Form</button>
    </form>
</div>
{% endblock %}
