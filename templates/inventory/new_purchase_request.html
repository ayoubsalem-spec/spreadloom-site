{% extends "inventory/base.html" %}
{% block content %}
<h1>Purchase Request</h1>
<p class="sub">Purchase Request Form</p>
<div class="card">
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-row">
            <div style="flex:1;"><label>PR#</label><input type="text" name="pr_number"></div>
            <div style="flex:1;"><label>Date</label><input type="date" name="request_date" value="{{ today }}" required></div>
        </div>
        <div class="form-row">
            <div style="flex:1;"><label>Job Name</label><input type="text" name="job_name" autofocus></div>
            <div style="flex:1;"><label>Location / Description of Use</label><input type="text" name="location_description"></div>
        </div>
        <div class="form-row">
            <div style="flex:1;"><label>Requested By</label><p style="margin:0; padding:11px 0; color:var(--text);"><strong>{{ current_user.name or current_user.email }}</strong></p></div>
            <div style="flex:1;"><label>Needed On</label><input type="date" name="needed_on"></div>
        </div>
        <label>Indicate Source of Supply if Known</label>
        <input type="text" name="source_of_supply">

        <h3 style="font-size:15px; color:var(--gold); margin:22px 0 10px;">Items</h3>
        <div class="card" style="padding:0; overflow-x:auto; background:var(--surface-2);">
            <table>
                <tr><th style="width:40px;">#</th><th>Item</th><th>Description</th><th>Supplier</th><th style="width:90px;">Qty</th></tr>
                {% for i in range(1, 10) %}
                <tr>
                    <td class="sub">{{ i }}</td>
                    <td><input type="text" name="item[]"></td>
                    <td><input type="text" name="description[]"></td>
                    <td><input type="text" name="supplier[]"></td>
                    <td><input type="text" name="qty[]"></td>
                </tr>
                {% endfor %}
            </table>
        </div>

        <h3 style="font-size:15px; color:var(--gold); margin:22px 0 10px;">Requestor</h3>
        <div class="form-row">
            <div style="flex:1;"><label>Signature</label><input type="text" name="requestor_signature"></div>
            <div style="flex:1;"><label>Date</label><input type="date" name="requestor_date" value="{{ today }}"></div>
        </div>

        <button type="submit" class="btn btn-gold" style="margin-top:16px;">Submit Request</button>
    </form>
</div>
{% endblock %}
