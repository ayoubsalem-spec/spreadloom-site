{% extends "base.html" %}
{% block title %}SitePulse{% endblock %}
{% block extra_body %}
<script>
    // Remembered-field autofill: any <input data-remember="key"> gets its
    // past values saved to localStorage and offered back via a datalist.
    (function () {
        function storageKey(key) { return 'sitepulse_remember_' + key; }
        function getSaved(key) {
            try { return JSON.parse(localStorage.getItem(storageKey(key)) || '[]'); }
            catch (e) { return []; }
        }
        function saveValue(key, value) {
            value = (value || '').trim();
            if (!value) return;
            var saved = getSaved(key).filter(function (v) { return v !== value; });
            saved.unshift(value);
            saved = saved.slice(0, 8);
            localStorage.setItem(storageKey(key), JSON.stringify(saved));
        }
        document.querySelectorAll('input[data-remember]').forEach(function (input) {
            var key = input.getAttribute('data-remember');
            var listId = 'remember-' + key;
            var saved = getSaved(key);
            if (saved.length) {
                var datalist = document.getElementById(listId);
                if (!datalist) {
                    datalist = document.createElement('datalist');
                    datalist.id = listId;
                    input.after(datalist);
                }
                datalist.innerHTML = '';
                saved.forEach(function (v) {
                    var opt = document.createElement('option');
                    opt.value = v;
                    datalist.appendChild(opt);
                });
                input.setAttribute('list', listId);
            }
            input.addEventListener('change', function () { saveValue(key, input.value); });
            var form = input.closest('form');
            if (form) {
                form.addEventListener('submit', function () { saveValue(key, input.value); });
            }
        });
    })();
</script>
{% endblock %}
