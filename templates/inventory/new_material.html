{% extends "inventory/base.html" %}
{% block content %}
<h1>Add Material</h1>
<div class="card">
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label>Item</label><input type="text" name="item_name" required autofocus>
        <label>Site</label><input type="text" name="site" list="site-options" required>
        <datalist id="site-options">{% for s in sites %}<option value="{{ s }}">{% endfor %}</datalist>
        <div class="form-row">
            <div style="flex:1;"><label>Quantity</label><input type="text" name="quantity"></div>
            <div style="flex:1;"><label>Unit</label><input type="text" name="unit"></div>
        </div>
        <label>Shelf/Location</label><input type="text" name="shelf_location">
        <label>Notes</label><input type="text" name="notes">
        <button type="submit" class="btn btn-gold" style="margin-top:16px;">Add Material</button>
    </form>
</div>
{% endblock %}
