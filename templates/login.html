{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:400px; margin:60px auto 0;">
    <h1 style="font-size:20px; margin-bottom:20px;">Log In</h1>
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label>Email</label>
        <input type="email" name="email" required autofocus>
        <label>Password</label>
        <input type="password" name="password" required>
        <button type="submit" class="btn btn-gold" style="width:100%; margin-top:20px;">Log In</button>
    </form>
    <p class="sub" style="margin-top:16px;">No account? <a href="{{ url_for('signup') }}" style="color:var(--brass);">Sign up</a></p>
</div>
{% endblock %}
