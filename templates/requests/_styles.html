<style>
    /* Request Center + Product Intelligence -- scoped to this module only.
       Built entirely from BuildIQ's existing tokens (--ink, --surface,
       --brass, --teal, --line, --text-dim, Space Grotesk / IBM Plex Mono)
       -- no new palette introduced, nothing here touches base.html or any
       other module's styles. */

    .rc-hero { margin-bottom:32px; }
    .rc-eyebrow {
        font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--brass);
        text-transform:uppercase; letter-spacing:1.5px; margin-bottom:8px; display:block;
    }
    .rc-hero h1 { margin-bottom:6px; }
    .rc-hero .sub { font-size:14.5px; max-width:520px; }

    /* --- Submit box --- */
    .rc-submit {
        background:var(--surface); border:1px solid var(--line); border-radius:8px;
        padding:26px 28px; margin-bottom:40px; position:relative; overflow:hidden;
    }
    .rc-submit::before {
        content:''; position:absolute; top:0; left:0; width:3px; height:100%;
        background:linear-gradient(var(--brass), var(--brass-dim));
    }
    .rc-submit textarea {
        font-size:15px; min-height:76px; resize:vertical;
    }
    .rc-submit-foot { display:flex; justify-content:space-between; align-items:center; margin-top:14px; }
    .rc-submit-hint { font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--text-faint); }

    /* --- Section headers within the requests list --- */
    .rc-section-label {
        font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--text-dim);
        text-transform:uppercase; letter-spacing:1px; margin:0 0 16px; display:flex;
        align-items:center; gap:10px;
    }
    .rc-section-label .count {
        background:var(--surface-2); border:1px solid var(--line); border-radius:10px;
        padding:1px 9px; color:var(--text-dim); font-size:10.5px;
    }

    /* --- Active request card with connected pipeline timeline --- */
    .req-card {
        background:var(--surface); border:1px solid var(--line); border-radius:8px;
        padding:22px 24px; margin-bottom:16px; transition:border-color 0.2s ease;
    }
    .req-card:hover { border-color:var(--brass-dim); }
    .req-card-top { display:flex; justify-content:space-between; align-items:start; gap:16px; }
    .req-card-text { margin:0; font-size:15px; line-height:1.5; max-width:75%; }
    .req-card-meta { color:var(--text-faint); font-size:11.5px; margin-top:8px; font-family:'IBM Plex Mono',monospace; }
    .req-attachments { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
    .req-attachments img { width:72px; height:72px; object-fit:cover; border-radius:5px; border:1px solid var(--line); transition:border-color 0.2s; }
    .req-attachments a:hover img { border-color:var(--brass-dim); }

    .req-timeline { display:flex; align-items:flex-start; margin-top:22px; padding:0 4px; }
    .req-timeline .step { display:flex; flex-direction:column; align-items:center; flex:1; position:relative; }
    .req-timeline .connector {
        position:absolute; top:5px; left:-50%; width:100%; height:2px; background:var(--line); z-index:1;
    }
    .req-timeline .step:first-child .connector { display:none; }
    .req-timeline .connector.done { background:var(--brass); }
    .req-timeline .dot {
        width:11px; height:11px; border-radius:50%; background:var(--ink); border:2px solid var(--line);
        z-index:2; transition:all 0.3s ease;
    }
    .req-timeline .dot.done { background:var(--brass); border-color:var(--brass); }
    .req-timeline .dot.current {
        border-color:var(--brass); background:var(--ink);
        animation:rc-pulse 2s ease-in-out infinite;
    }
    @keyframes rc-pulse {
        0%, 100% { box-shadow:0 0 0 4px rgba(201,162,75,0.18); }
        50% { box-shadow:0 0 0 8px rgba(201,162,75,0.05); }
    }
    .req-timeline .step-label {
        font-family:'IBM Plex Mono',monospace; font-size:9px; text-transform:uppercase;
        letter-spacing:0.5px; color:var(--text-faint); margin-top:9px; text-align:center;
    }
    .req-timeline .step-label.done, .req-timeline .step-label.current { color:var(--brass); font-weight:600; }

    .req-offpath {
        margin-top:16px; padding:10px 14px; border-radius:6px; font-size:13px;
        background:var(--surface-2); color:var(--text-dim); border:1px solid var(--line);
    }

    /* --- Released / shipped showcase --- */
    .req-released {
        background:linear-gradient(135deg, rgba(94,234,212,0.07), rgba(94,234,212,0.015));
        border:1px solid var(--teal); border-radius:8px; padding:22px 24px; margin-bottom:16px;
        position:relative;
    }
    .req-released-badge {
        position:absolute; top:18px; right:20px; font-family:'IBM Plex Mono',monospace;
        font-size:9.5px; font-weight:700; letter-spacing:1px; color:var(--teal);
        border:1px solid var(--teal); border-radius:2px; padding:3px 8px;
    }
    .req-released-text { margin:0; font-size:15px; line-height:1.5; max-width:75%; color:var(--text-dim); }
    .req-released-note {
        margin-top:14px; padding-top:14px; border-top:1px solid rgba(94,234,212,0.2);
        color:var(--text); font-size:14px; line-height:1.55;
    }
    .req-released-note strong { color:var(--teal); font-family:'IBM Plex Mono',monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:0.8px; display:block; margin-bottom:6px; }

    /* --- Status badges (used in Product Intelligence table + preview) --- */
    .rc-badge {
        font-family:'IBM Plex Mono',monospace; font-size:9.5px; font-weight:600; letter-spacing:0.8px;
        text-transform:uppercase; padding:3px 9px; border-radius:2px; border:1.5px solid; display:inline-block;
    }
    .rc-badge.b-submitted { color:var(--cyan); border-color:var(--cyan); }
    .rc-badge.b-progress { color:var(--brass); border-color:var(--brass); }
    .rc-badge.b-released { color:var(--teal); border-color:var(--teal); }
    .rc-badge.b-stalled { color:var(--text-faint); border-color:var(--text-faint); }
    .rc-badge.b-reviewing { color:var(--cyan); border-color:var(--cyan); }
    .rc-badge.b-approved { color:var(--brass-dim); border-color:var(--brass-dim); }
    .rc-badge.b-testing { color:#5AC8E0; border-color:#5AC8E0; }
    .rc-badge.b-attention { color:var(--red); border-color:var(--red); }

    /* --- Product Intelligence dashboard --- */
    .pi-section { margin-bottom:36px; }
    .pi-kpi-grid { grid-template-columns:repeat(6,1fr); }
    @media (max-width:860px) { .pi-kpi-grid { grid-template-columns:repeat(3,1fr); } }
    @media (max-width:520px) { .pi-kpi-grid { grid-template-columns:repeat(2,1fr); } }
    .pi-section-title {
        font-family:'Space Grotesk',sans-serif; font-size:15px; font-weight:700; margin-bottom:14px;
        display:flex; align-items:center; gap:8px;
    }
    .pi-section-title .dim { color:var(--text-faint); font-weight:500; font-size:12px; font-family:'IBM Plex Mono',monospace; }

    .pi-pipeline { display:flex; height:34px; border-radius:5px; overflow:hidden; border:1px solid var(--line); }
    .pi-pipeline-seg { display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono',monospace; font-size:10.5px; font-weight:600; color:var(--ink); min-width:2px; transition:opacity 0.2s; }
    .pi-pipeline-seg:hover { opacity:0.85; }
    .pi-pipeline-legend { display:flex; gap:18px; flex-wrap:wrap; margin-top:12px; }
    .pi-pipeline-legend-item { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text-dim); }
    .pi-pipeline-legend-swatch { width:10px; height:10px; border-radius:2px; }

    .pi-bar-row { display:flex; align-items:center; gap:12px; margin-bottom:12px; }
    .pi-bar-label { width:140px; font-size:13px; color:var(--text-dim); flex-shrink:0; }
    .pi-bar-track { flex:1; height:8px; background:var(--surface-2); border-radius:4px; overflow:hidden; }
    .pi-bar-fill { height:100%; background:linear-gradient(90deg, var(--brass-dim), var(--brass)); border-radius:4px; }
    .pi-bar-count { width:28px; text-align:right; font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--text-dim); flex-shrink:0; }

    .pi-two-col { display:grid; grid-template-columns:1fr 1fr; gap:28px; }
    @media (max-width:860px) { .pi-two-col { grid-template-columns:1fr; } }

    .pi-feed-item { padding:10px 0; border-bottom:1px solid var(--line); font-size:13px; }
    .pi-feed-item:last-child { border-bottom:none; }
    .pi-feed-meta { color:var(--text-faint); font-size:11px; font-family:'IBM Plex Mono',monospace; margin-top:3px; }

    .pi-shipped-strip { display:flex; gap:14px; overflow-x:auto; padding-bottom:6px; }
    .pi-shipped-card {
        min-width:260px; background:linear-gradient(135deg, rgba(94,234,212,0.06), transparent);
        border:1px solid var(--teal); border-radius:8px; padding:16px 18px; flex-shrink:0;
    }
    .pi-shipped-card .req { font-size:13px; color:var(--text-dim); margin-bottom:8px; line-height:1.4; }
    .pi-shipped-card .note { font-size:13px; color:var(--text); line-height:1.4; }

    /* --- Recently Resolved: compact card list --- */
    .pi-resolved-item {
        position:relative; background:linear-gradient(135deg, rgba(94,234,212,0.055), var(--surface) 60%);
        border:1px solid var(--line); border-left:3px solid var(--teal); border-radius:6px;
        padding:14px 16px 14px 15px; margin-bottom:10px; display:flex; gap:12px; align-items:flex-start;
        transition:border-color 0.18s ease, box-shadow 0.18s ease, transform 0.18s ease;
    }
    .pi-resolved-item:hover {
        border-color:var(--teal); transform:translateY(-1px);
        box-shadow:0 0 0 1px rgba(94,234,212,0.14), 0 6px 16px rgba(0,0,0,0.25);
    }
    .pi-resolved-icon {
        width:26px; height:26px; border-radius:50%; flex-shrink:0; margin-top:2px;
        background:radial-gradient(circle at 35% 30%, rgba(94,234,212,0.4), rgba(94,234,212,0.12));
        border:1px solid var(--teal); color:var(--teal);
        display:flex; align-items:center; justify-content:center; font-size:12px;
        box-shadow:0 0 9px rgba(94,234,212,0.28);
    }
    .pi-resolved-body { flex:1; min-width:0; }
    .pi-resolved-eyebrow {
        font-family:'IBM Plex Mono',monospace; font-size:9px; font-weight:700; letter-spacing:0.9px;
        color:var(--teal); text-transform:uppercase; margin-bottom:4px; display:block;
    }
    .pi-resolved-top { display:flex; justify-content:space-between; align-items:start; gap:10px; }
    .pi-resolved-title { font-size:13.5px; font-weight:600; line-height:1.4; }
    .pi-resolved-module {
        font-family:'IBM Plex Mono',monospace; font-size:9px; text-transform:uppercase; letter-spacing:0.6px;
        color:var(--teal); background:rgba(94,234,212,0.1); border:1px solid rgba(94,234,212,0.28);
        border-radius:3px; padding:2px 7px; flex-shrink:0; white-space:nowrap;
    }
    .pi-resolved-note { font-size:12.5px; color:var(--text-dim); line-height:1.5; margin-top:5px; }
    .pi-resolved-meta {
        display:flex; align-items:center; gap:9px; margin-top:11px; padding-top:10px;
        border-top:1px solid rgba(255,255,255,0.045);
    }
    .pi-resolved-meta-text { font-size:11px; color:var(--text-faint); font-family:'IBM Plex Mono',monospace; }
    .pi-avatar {
        width:18px; height:18px; border-radius:50%; background:var(--brass-dim); color:var(--ink);
        font-size:9.5px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0;
    }

    /* --- Recent Activity: compact icon feed --- */
    .pi-activity-item { display:flex; gap:11px; align-items:flex-start; padding:9px 6px; border-bottom:1px solid var(--line); border-radius:4px; margin:0 -6px; transition:background 0.15s ease; }
    .pi-activity-item:hover { background:rgba(255,255,255,0.02); }
    .pi-activity-item:last-child { border-bottom:none; }
    .pi-activity-icon {
        width:26px; height:26px; border-radius:50%; flex-shrink:0; margin-top:1px;
        display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700;
        background:var(--surface-2); border:1px solid var(--line);
    }
    .pi-activity-body { flex:1; min-width:0; display:flex; justify-content:space-between; gap:10px; align-items:start; }
    .pi-activity-status { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.4px; }
    .pi-activity-title { font-size:12.5px; color:var(--text); margin-top:2px; line-height:1.4; }
    .pi-activity-right { text-align:right; flex-shrink:0; }
    .pi-activity-time { font-size:10.5px; color:var(--text-faint); font-family:'IBM Plex Mono',monospace; }
    .pi-activity-user { font-size:10.5px; color:var(--text-dim); margin-top:2px; }

    /* --- All Requests: premium table --- */
    .pi-table-toolbar { display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
    .pi-table-toolbar select { width:auto; min-width:170px; flex:0 0 auto; }
    .pi-req-title { font-weight:600; font-size:13.5px; }
    .pi-req-id { font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--text-faint); margin-top:2px; }

    /* --- Final polish pass: KPI active state, table row hover, section rhythm --- */
    .kpi-active { border-color:var(--brass); box-shadow:0 0 0 1px rgba(201,162,75,0.25); }
    .pi-section table tr:not(:first-child):hover td { background:rgba(255,255,255,0.025); }
    .pi-section table tr:not(:first-child) { transition:background 0.12s ease; }
    .pi-section-title { letter-spacing:0.2px; }

    .pi-preview-btn { position:relative; }

    /* --- Command Center: hero, focus rail, attention, health, adoption, roadmap, ask-atlas --- */
    .cc-status-pill {
        display:inline-flex; align-items:center; gap:6px; font-family:'IBM Plex Mono',monospace;
        font-size:10.5px; letter-spacing:0.8px; color:var(--teal); border:1px solid var(--teal);
        border-radius:20px; padding:4px 12px; margin-top:10px;
    }
    .cc-status-dot { width:6px; height:6px; border-radius:50%; background:var(--teal); box-shadow:0 0 6px var(--teal); }

    .cc-focus-rail { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
    @media (max-width:860px) { .cc-focus-rail { grid-template-columns:1fr; } }
    .cc-focus-card {
        background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:16px 18px;
        text-decoration:none; color:var(--text); display:block; transition:border-color 0.15s ease, transform 0.15s ease;
        position:relative; overflow:hidden;
    }
    .cc-focus-card:hover { border-color:var(--brass-dim); transform:translateY(-1px); }
    .cc-focus-num { font-family:'IBM Plex Mono',monospace; font-size:22px; font-weight:700; color:var(--line); position:absolute; top:10px; right:14px; }
    .cc-focus-tag {
        font-family:'IBM Plex Mono',monospace; font-size:9px; font-weight:700; letter-spacing:0.6px;
        text-transform:uppercase; padding:2px 8px; border-radius:2px; display:inline-block; margin-bottom:8px;
    }
    .cc-focus-tag.now { color:var(--brass); border:1px solid var(--brass); }
    .cc-focus-tag.next { color:var(--cyan); border:1px solid var(--cyan); }
    .cc-focus-tag.evolving { color:#5AC8E0; border:1px solid #5AC8E0; }
    .cc-focus-tag.later { color:var(--text-faint); border:1px solid var(--text-faint); }
    .cc-focus-name { font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:15px; margin-bottom:4px; }
    .cc-focus-desc { font-size:12px; color:var(--text-dim); line-height:1.4; }

    .cc-attention-list { display:flex; flex-direction:column; gap:8px; }
    .cc-attention-row {
        display:flex; justify-content:space-between; align-items:center; gap:12px;
        background:rgba(248,113,113,0.05); border:1px solid var(--red); border-radius:6px;
        padding:12px 16px; text-decoration:none; color:var(--text); transition:background 0.15s ease;
    }
    .cc-attention-row:hover { background:rgba(248,113,113,0.1); }
    .cc-attention-row .arrow { color:var(--red); font-family:'IBM Plex Mono',monospace; }
    .cc-attention-clear {
        background:rgba(94,234,212,0.05); border:1px solid var(--teal); border-radius:6px;
        padding:14px 16px; color:var(--teal); font-family:'IBM Plex Mono',monospace; font-size:12px; text-align:center;
    }

    .cc-health-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    @media (max-width:860px) { .cc-health-grid { grid-template-columns:1fr; } }
    .cc-health-row {
        display:flex; justify-content:space-between; align-items:center; padding:12px 16px;
        background:var(--surface); border:1px solid var(--line); border-radius:6px;
        text-decoration:none; color:var(--text); transition:border-color 0.15s ease;
    }
    .cc-health-row:hover { border-color:var(--brass-dim); }
    .cc-health-name { font-weight:600; font-size:13.5px; }
    .cc-health-meta { font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--text-faint); margin-top:2px; }
    .cc-health-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
    .cc-health-dot.live { background:var(--teal); box-shadow:0 0 6px var(--teal); }
    .cc-health-dot.quiet { background:var(--text-faint); }
    .cc-health-dot.none { background:var(--line); }

    .cc-adopt-hero { display:flex; align-items:baseline; gap:10px; margin-bottom:6px; }
    .cc-adopt-value { font-family:'Space Grotesk',sans-serif; font-size:36px; font-weight:700; color:var(--teal); }
    .cc-adopt-label { font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.6px; }
    .cc-adopt-bar { height:8px; background:var(--surface-2); border-radius:4px; overflow:hidden; margin-top:10px; }
    .cc-adopt-fill { height:100%; background:linear-gradient(90deg, var(--brass-dim), var(--teal)); }

    .cc-roadmap { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
    @media (max-width:860px) { .cc-roadmap { grid-template-columns:1fr 1fr; } }
    @media (max-width:520px) { .cc-roadmap { grid-template-columns:1fr; } }
    .cc-roadmap-col { border-top:2px solid var(--line); padding-top:10px; }
    .cc-roadmap-col.now { border-top-color:var(--brass); }
    .cc-roadmap-col.next { border-top-color:var(--cyan); }
    .cc-roadmap-col.evolving { border-top-color:#5AC8E0; }
    .cc-roadmap-col.later { border-top-color:var(--text-faint); }
    .cc-roadmap-heading { font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.8px; color:var(--text-faint); text-transform:uppercase; margin-bottom:8px; }
    .cc-roadmap-item { font-size:13px; padding:6px 0; color:var(--text-dim); }
    .cc-roadmap-item a { color:var(--text); text-decoration:none; }
    .cc-roadmap-item a:hover { color:var(--brass); }

    .cc-ask-atlas {
        background:linear-gradient(135deg, rgba(201,162,75,0.06), var(--surface) 60%);
        border:1px solid var(--brass); border-radius:8px; padding:22px 26px;
        display:flex; justify-content:space-between; align-items:center; gap:20px; flex-wrap:wrap;
    }
    .cc-ask-atlas-q { font-family:'Space Grotesk',sans-serif; font-size:16px; font-weight:700; margin-bottom:6px; }
    .cc-ask-atlas-suggestions { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
    .cc-ask-chip {
        font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--text-dim); border:1px solid var(--line);
        border-radius:20px; padding:4px 12px; text-decoration:none;
    }
    .cc-ask-chip:hover { border-color:var(--brass); color:var(--brass); }

    /* --- Command Center v2: stronger hero, connected focus flow, trends, pulse --- */
    .cc-hero-band {
        position:relative; padding:32px 34px; margin-bottom:26px; border-radius:8px;
        background:linear-gradient(135deg, rgba(201,162,75,0.08), rgba(94,234,212,0.03) 60%, transparent);
        border:1px solid var(--line); overflow:hidden;
    }
    .cc-hero-band::before {
        content:''; position:absolute; top:-40%; right:-10%; width:320px; height:320px; border-radius:50%;
        background:radial-gradient(circle, rgba(201,162,75,0.12), transparent 70%); pointer-events:none;
    }
    .cc-hero-title { font-size:42px; margin:6px 0 2px; }
    .cc-hero-sub { font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:1px; text-transform:uppercase; color:var(--text-dim); margin-bottom:0; }
    .cc-hero-snapshot { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-top:26px; position:relative; }
    @media (max-width:720px) { .cc-hero-snapshot { grid-template-columns:1fr 1fr; } }
    .cc-snapshot-item { text-decoration:none; color:var(--text); border-left:2px solid var(--line); padding-left:12px; transition:border-color 0.15s ease; }
    .cc-snapshot-item:hover { border-left-color:var(--brass); }
    .cc-snapshot-value { font-family:'Space Grotesk',sans-serif; font-size:26px; font-weight:700; line-height:1; }
    .cc-snapshot-label { font-family:'IBM Plex Mono',monospace; font-size:9.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.5px; margin-top:4px; }

    .cc-focus-hero { background:var(--surface); border:1px solid var(--brass-dim); border-radius:8px; padding:22px 24px 18px; margin-bottom:22px; }
    .cc-flow { display:flex; align-items:stretch; gap:0; margin-top:16px; flex-wrap:wrap; }
    .cc-flow-stage { flex:1; min-width:170px; padding:0 16px; }
    .cc-flow-stage:first-child { padding-left:0; }
    .cc-flow-arrow { display:flex; align-items:center; color:var(--line); font-size:18px; padding:0 4px; }
    .cc-flow-heading {
