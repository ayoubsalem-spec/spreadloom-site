{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:400px; margin:60px auto 0;">
    <h1 style="font-size:20px; margin-bottom:20px;">Create Account</h1>
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label>Name</label>
        <input type="text" name="name" autofocus>
        <label>Email (@darycet.com)</label>
        <input type="email" name="email" required>
        <label>Password</label>
        <input type="password" name="password" required>
        <button type="submit" class="btn btn-gold" style="width:100%; margin-top:20px;">Create Account</button>
    </form>
    <p class="sub" style="margin-top:16px;">Already have an account? <a href="{{ url_for('login') }}" style="color:var(--brass);">Log in</a></p>
</div>
{% endblock %}
