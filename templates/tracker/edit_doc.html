{% extends "tracker/base.html" %}
{% block content %}
<div class="card" style="max-width:520px; margin:0 auto;">
    <h1 style="font-size:20px;">Edit Document</h1>
    <p class="sub">{{ project['name'] }}</p>
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label>Document Name</label>
        <input type="text" name="doc_name" value="{{ d['doc_name'] }}" required>

        <label>Type</label>
        <input type="text" name="doc_type" value="{{ d['doc_type'] or '' }}" placeholder="Permit, Plan Set, RFI...">

        <label>Status</label>
        <select name="status">
            <option value="Needed" {{ 'selected' if d['status']=='Needed' }}>Needed</option>
            <option value="Requested" {{ 'selected' if d['status']=='Requested' }}>Requested</option>
            <option value="On File" {{ 'selected' if d['status']=='On File' }}>On File</option>
        </select>

        <label>Location (network path or shared drive link)</label>
        <input type="text" name="link" value="{{ d['link'] or '' }}" placeholder="P:\... or https://...">

        <label>Notes</label>
        <textarea name="notes">{{ d['notes'] or '' }}</textarea>

        <button type="submit" class="btn-gold">Save Changes</button>
        <a href="{{ url_for('tracker_view_project', project_id=project['id']) }}" class="btn" style="margin-left:8px;">Cancel</a>
    </form>

    <hr class="divider">
    <form method="POST" action="{{ url_for('tracker_delete_doc', doc_id=d['id']) }}"
          onsubmit="return confirm('Delete this document entry?');">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit" style="color:#F87171; border-color:#7F1D1D;">Delete Document</button>
    </form>
</div>
{% endblock %}
