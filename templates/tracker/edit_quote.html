{% extends "tracker/base.html" %}
{% block content %}
<div class="card" style="max-width:520px; margin:0 auto;">
    <h1 style="font-size:20px;">Edit Vendor Quote</h1>
    <p class="sub">{{ project['name'] }}</p>
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label>Trade</label>
        <input type="text" name="trade" value="{{ q['trade'] }}" required>

        <label>Vendor Name</label>
        <input type="text" name="vendor_name" value="{{ q['vendor_name'] or '' }}">

        <label>Contact Name</label>
        <input type="text" name="vendor_contact" value="{{ q['vendor_contact'] or '' }}">

        <label>Contact Email</label>
        <input type="email" name="vendor_email" value="{{ q['vendor_email'] or '' }}">

        <label>Contact Phone</label>
        <input type="text" name="vendor_phone" value="{{ q['vendor_phone'] or '' }}">

        <label>RFQ Sent Date</label>
        <input type="date" name="rfq_sent_date" value="{{ q['rfq_sent_date'] or '' }}">

        <label>Status</label>
        <select name="status">
            <option value="Not Sent" {{ 'selected' if q['status']=='Not Sent' }}>Not Sent</option>
            <option value="Sent" {{ 'selected' if q['status']=='Sent' }}>Sent</option>
            <option value="Received" {{ 'selected' if q['status']=='Received' }}>Received</option>
        </select>

        <label>Amount</label>
        <input type="text" name="amount" value="{{ q['amount'] or '' }}">

        <label style="display:flex; align-items:center; gap:8px; margin-top:16px;">
            <input type="checkbox" name="is_submit_blocking" style="width:auto;" {{ 'checked' if q['is_submit_blocking'] }}>
            This quote blocks bid submission if missing
        </label>

        <label>Notes</label>
        <textarea name="notes">{{ q['notes'] or '' }}</textarea>

        <button type="submit" class="btn-gold">Save Changes</button>
        <a href="{{ url_for('tracker_view_project', project_id=project['id']) }}" class="btn" style="margin-left:8px;">Cancel</a>
    </form>
</div>
{% endblock %}
