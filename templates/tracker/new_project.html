{% extends "tracker/base.html" %}
{% block content %}
<a href="{{ url_for('tracker_dashboard') }}" class="btn btn-sm" style="margin-bottom:16px;">&larr; Project Hunt</a>
<div class="card" style="max-width:520px; margin:0 auto;">
    <h1 style="font-size:20px;">New Project</h1>
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label>Project Name</label>
        <input type="text" name="name" placeholder="Talitha Cumi Grand Corner Church" required>

        <label>Client</label>
        <input type="text" name="client" placeholder="Client or Owner name">

        <label>Address</label>
        <input type="text" name="address" placeholder="Street address">

        <label>Bid Due Date</label>
        <input type="date" name="bid_due_date">

        <label>Estimated Value</label>
        <input type="text" name="estimated_value" placeholder="$487,500">

        <label>Status</label>
        <select name="status">
            {% for s in status_options %}<option value="{{ s }}">{{ s }}</option>{% endfor %}
        </select>

        <label>Assigned To</label>
        <input type="text" name="assigned_to" placeholder="Estimator name">

        <label>Notes</label>
        <textarea name="notes"></textarea>

        <button type="submit" class="btn btn-gold">Create Project</button>
    </form>
</div>
{% endblock %}
