{% extends "sitepulse/base.html" %}
{% block content %}
<h1>Add Equipment</h1>
<div class="card">
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label>Name</label>
        <input type="text" name="name" required autofocus>
        <label>Description</label>
        <input type="text" name="description">
        <div class="form-row">
            <div style="flex:1;"><label>Year</label><input type="text" name="year"></div>
            <div style="flex:1;"><label>Serial Number</label><input type="text" name="serial_number"></div>
        </div>
        <div class="form-row">
            <div style="flex:1;"><label>Value</label><input type="text" name="value"></div>
            <div style="flex:1;"><label>Hours / Mileage</label><input type="text" name="hours_mileage"></div>
        </div>
        <div class="form-row">
            <div style="flex:1;"><label>Daily Rate</label><input type="text" name="daily_rate"></div>
            <div style="flex:1;"><label>Weekly Rate</label><input type="text" name="weekly_rate"></div>
            <div style="flex:1;"><label>Monthly Rate</label><input type="text" name="monthly_rate"></div>
        </div>
        <div class="form-row">
            <div style="flex:1;"><label>Site</label><input type="text" name="site"></div>
            <div style="flex:1;"><label>Current Location</label><input type="text" name="location"></div>
        </div>
        <label>Tracks</label>
        <select name="equipment_type">
            <option value="mileage">Mileage (vehicles)</option>
            <option value="engine_hours">Engine Hours (machinery)</option>
        </select>
        <button type="submit" class="btn btn-gold">Add Equipment</button>
    </form>
</div>
{% endblock %}
