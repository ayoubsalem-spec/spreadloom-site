{% extends "base.html" %}

{% block extra_head %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
{% endblock %}

{% block context_nav %}
<div class="context-nav">
    <a href="{{ url_for('sitepulse_dashboard') }}" class="{{ 'active' if request.path == '/sitepulse/' }}">Equipment</a>
    <a href="{{ url_for('sitepulse_rentals_list') }}" class="{{ 'active' if request.path.startswith('/sitepulse/rentals') }}">Rentals</a>
    {% if current_user.email == "ayoub@darycet.com" %}
    <a href="{{ url_for('sitepulse_activity_log') }}" class="{{ 'active' if request.path.startswith('/sitepulse/activity') }}">Activity</a>
    {% endif %}
</div>
{% endblock %}

{% block content %}{% block inner %}{% endblock %}{% endblock %}
