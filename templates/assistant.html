{% extends "base.html" %}
{% block content %}
<meta name="csrf-token" content="{{ csrf_token() }}">
<style>
    .atlas-shell { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; height: calc(100vh - 140px); min-height: 480px; }
    .atlas-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 16px; flex-shrink: 0; }
    .atlas-header h1 { display: flex; align-items: center; gap: 10px; }
    .atlas-live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--teal); box-shadow: 0 0 0 0 rgba(94,234,212,0.5); animation: atlas-pulse 1.8s infinite; }
    @keyframes atlas-pulse { 0% { box-shadow: 0 0 0 0 rgba(94,234,212,0.4); } 70% { box-shadow: 0 0 0 8px rgba(94,234,212,0); } 100% { box-shadow: 0 0 0 0 rgba(94,234,212,0); } }

    .atlas-messages { flex: 1; overflow-y: auto; padding: 8px 4px 16px; display: flex; flex-direction: column; gap: 14px; }
    .atlas-msg { max-width: 78%; padding: 12px 16px; border-radius: 10px; font-size: 14px; line-height: 1.5; }
    .atlas-msg.user { align-self: flex-end; background: var(--surface-2); border: 1px solid var(--line); color: var(--text); border-bottom-right-radius: 2px; }
    .atlas-msg.assistant { align-self: flex-start; background: var(--surface); border: 1px solid var(--brass-dim); color: var(--text); border-bottom-left-radius: 2px; }
    .atlas-msg.assistant .atlas-msg-label { font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; color: var(--brass); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; display: block; }
    .atlas-msg.system { align-self: center; background: rgba(94,234,212,0.1); border: 1px solid var(--teal); color: var(--teal); font-family: 'IBM Plex Mono', monospace; font-size: 12px; padding: 8px 16px; border-radius: 6px; }
    .atlas-msg.error { align-self: center; background: rgba(248,113,113,0.08); border: 1px solid var(--red); color: #FCA5A5; font-size: 12.5px; padding: 8px 16px; border-radius: 6px; }
    .atlas-typing { align-self: flex-start; display: flex; gap: 4px; padding: 12px 16px; }
    .atlas-typing span { width: 6px; height: 6px; border-radius: 50%; background: var(--text-faint); animation: atlas-typing 1.2s infinite; }
    .atlas-typing span:nth-child(2) { animation-delay: 0.2s; }
    .atlas-typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes atlas-typing { 0%, 60%, 100% { opacity: 0.3; } 30% { opacity: 1; } }

    .atlas-empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: var(--text-dim); }
    .atlas-empty-mark { width: 64px; height: 64px; border-radius: 50%; border: 1.5px solid var(--brass); display: flex; align-items: center; justify-content: center; margin-bottom: 18px; }

    .atlas-inputbar { flex-shrink: 0; border-top: 1px solid var(--line); padding-top: 14px; margin-top: 8px; }
    .atlas-inputrow { display: flex; gap: 8px; align-items: flex-end; }
    .atlas-textinput { flex: 1; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; color: var(--text); font-family: 'Inter', sans-serif; font-size: 14px; resize: none; max-height: 120px; }
    .atlas-textinput:focus { outline: none; border-color: var(--brass-dim); }
    .atlas-send-btn { background: linear-gradient(135deg, var(--brass), var(--brass-dim)); border: none; color: var(--ink); font-weight: 700; border-radius: 8px; width: 44px; height: 44px; flex-shrink: 0; cursor: pointer; font-size: 16px; }
    .atlas-send-btn:disabled { opacity: 0.4; cursor: default; }
    .atlas-mic-btn { background: var(--surface-2); border: 1px solid var(--line); color: var(--text-dim); border-radius: 8px; width: 44px; height: 44px; flex-shrink: 0; cursor: pointer; font-size: 17px; transition: all 0.15s; }
    .atlas-mic-btn.listening { background: rgba(201,162,75,0.15); border-color: var(--brass); color: var(--brass); box-shadow: 0 0 0 4px rgba(201,162,75,0.15); }
    .atlas-status { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-faint); margin-top: 8px; min-height: 14px; }
    .atlas-reset-link { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-faint); cursor: pointer; }
    .atlas-reset-link:hover { color: var(--text-dim); }
</style>

<div class="atlas-shell">
    <div class="atlas-header">
        <div>
            <span class="rc-eyebrow">BuildIQ Assistant</span>
            <h1><span class="atlas-live-dot"></span>Atlas</h1>
            <p class="sub" style="margin-top:2px;">Ask about the business, or submit a concrete request &mdash; type or talk.</p>
        </div>
        <span id="reset-btn" class="atlas-reset-link" style="display:none;">Start Over</span>
    </div>

    <div id="atlas-messages" class="atlas-messages">
        <div id="atlas-empty" class="atlas-empty">
            <div class="atlas-empty-mark">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M12 2L4 6v6c0 5 3.5 8.5 8 10 4.5-1.5 8-5 8-10V6l-8-4z" stroke="#C9A24B" stroke-width="1.5"/></svg>
            </div>
            <p style="font-family:'Space Grotesk',sans-serif; font-size:15px; color:var(--text); margin-bottom:6px;">What do you need?</p>
            <p style="font-size:12.5px; max-width:320px;">Ask "how many active bids do we have" or say "I need to submit a concrete request for Patel Farm."</p>
        </div>
    </div>

    <div class="atlas-inputbar">
        <div class="atlas-inputrow">
            <textarea id="text-input" class="atlas-textinput" rows="1" placeholder="Message Atlas..."></textarea>
            <button id="mic-btn" class="atlas-mic-btn" title="Talk">&#127908;</button>
            <button id="send-btn" class="atlas-send-btn" title="Send">&#8593;</button>
        </div>
        <p id="status-line" class="atlas-status"></p>
    </div>
</div>

<script>
(function () {
    var messagesEl = document.getElementById('atlas-messages');
    var emptyEl = document.getElementById('atlas-empty');
    var textInput = document.getElementById('text-input');
    var sendBtn = document.getElementById('send-btn');
    var micBtn = document.getElementById('mic-btn');
    var statusLine = document.getElementById('status-line');
    var resetBtn = document.getElementById('reset-btn');
    var csrfToken = document.querySelector('meta[name="csrf-token"]').content;

    function setStatus(text) { statusLine.textContent = text; }
    function scrollToBottom() { messagesEl.scrollTop = messagesEl.scrollHeight; }

    function addMessage(role, text) {
        emptyEl.style.display = 'none';
        var div = document.createElement('div');
        div.className = 'atlas-msg ' + role;
        if (role === 'assistant') {
            var label = document.createElement('span');
            label.className = 'atlas-msg-label';
            label.textContent = 'Atlas';
            div.appendChild(label);
        }
        var body = document.createElement('span');
        body.textContent = text;
        div.appendChild(body);
        messagesEl.appendChild(div);
        scrollToBottom();
        return div;
    }

    function addTyping() {
        emptyEl.style.display = 'none';
        var div = document.createElement('div');
        div.className = 'atlas-typing';
        div.id = 'atlas-typing-indicator';
        div.innerHTML = '<span></span><span></span><span></span>';
        messagesEl.appendChild(div);
        scrollToBottom();
    }
    function removeTyping() {
        var el = document.getElementById('atlas-typing-indicator');
        if (el) el.remove();
    }

    function unlockSpeechIfNeeded() {
        if (!window.speechSynthesis) return;
        var warm = new SpeechSynthesisUtterance('.');
        warm.volume = 0;
        window.speechSynthesis.speak(warm);
    }

    function speak(text, audioB64) {
        if (audioB64) {
            var audio = new Audio('data:audio/mpeg;base64,' + audioB64);
            var playPromise = audio.play();
            if (playPromise && playPromise.catch) {
                playPromise.catch(function () {
                    armAutoReplayOnNextTap(function () { audio.play().catch(function () {}); });
                });
            }
            return;
        }
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        var utter = new SpeechSynthesisUtterance(text);
        utter.rate = 1.0;
        utter.onerror = function () {
            armAutoReplayOnNextTap(function () {
                window.speechSynthesis.cancel();
                window.speechSynthesis.speak(new SpeechSynthesisUtterance(text));
            });
        };
        window.speechSynthesis.speak(utter);
    }

    var autoReplayArmed = false;
    function armAutoReplayOnNextTap(playFn) {
        if (autoReplayArmed) return;
        autoReplayArmed = true;
        function onNextTap() {
            document.removeEventListener('touchend', onNextTap, true);
            document.removeEventListener('click', onNextTap, true);
            autoReplayArmed = false;
            playFn();
        }
        document.addEventListener('touchend', onNextTap, true);
        document.addEventListener('click', onNextTap, true);
    }

    function askServer(question) {
        addMessage('user', question);
        streamFromServer(function (formOrNull) {
            return fetch('{{ url_for("assistant_ask") }}', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken },
                body: JSON.stringify({ question: question })
            });
        }, true);
    }

    function askServerWithAudio(blob) {
        var formData = new FormData();
        formData.append('audio', blob, 'atlas.webm');
        streamFromServer(function () {
            return fetch('{{ url_for("assistant_ask") }}', {
                method: 'POST',
                headers: { 'X-CSRFToken': csrfToken },
                body: formData
            });
        }, false);
    }

    // Shared SSE consumer for both the typed and voice paths. `questionAlreadyShown`
    // is true for typed input (we show it immediately) and false for voice
    // (the transcript comes back from the server as the first event).
    function streamFromServer(doFetch, questionAlreadyShown) {
        setStatus('Thinking...');
        sendBtn.disabled = true;
        var assistantBubble = null;
        var assistantText = '';

        doFetch().then(function (response) {
            var reader = response.body.getReader();
            var decoder = new TextDecoder();
            var buffer = '';

            function pump() {
                return reader.read().then(function (result) {
                    if (result.done) return;
                    buffer += decoder.decode(result.value, { stream: true });
                    var parts = buffer.split('\n\n');
                    buffer = parts.pop();
                    parts.forEach(function (part) {
                        var line = part.split('\n').find(function (l) { return l.indexOf('data:') === 0; });
                        if (!line) return;
                        var evt;
                        try { evt = JSON.parse(line.slice(5).trim()); } catch (e) { return; }
                        handleEvent(evt);
                    });
                    return pump();
                });
            }

            function handleEvent(evt) {
                if (evt.type === 'question') {
                    if (!questionAlreadyShown) addMessage('user', evt.text);
                    if (evt.transcribe_error) addMessage('error', 'Could not transcribe: ' + evt.transcribe_error);
                } else if (evt.type === 'delta') {
                    if (!assistantBubble) {
                        removeTyping();
                        assistantBubble = addMessage('assistant', '');
                    }
                    assistantText += evt.text;
                    assistantBubble.querySelector('span:last-child').textContent = assistantText;
                    scrollToBottom();
                } else if (evt.type === 'done') {
                    setStatus('');
                    sendBtn.disabled = false;
                    if (assistantText) speak(assistantText, evt.audio);
                    if (evt.audio_error) addMessage('error', 'Atlas voice unavailable, using free voice instead: ' + evt.audio_error);
                    if (evt.submitted_id) addMessage('system', '\u2713 Concrete request #' + evt.submitted_id + ' submitted');
                    resetBtn.style.display = (evt.mode === 'concrete_request') ? 'inline-block' : 'none';
                }
            }

            addTyping();
            return pump();
        }).catch(function () {
            removeTyping();
            setStatus('');
            sendBtn.disabled = false;
            addMessage('error', 'Something went wrong reaching the assistant.');
        });
    }

    function sendTyped() {
        var text = textInput.value.trim();
        if (!text) return;
        textInput.value = '';
        textInput.style.height = 'auto';
        unlockSpeechIfNeeded();
        askServer(text);
    }
    sendBtn.addEventListener('click', sendTyped);
    textInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendTyped(); }
    });
    textInput.addEventListener('input', function () {
        textInput.style.height = 'auto';
        textInput.style.height = Math.min(textInput.scrollHeight, 120) + 'px';
    });

    var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    var recognition = null;
    if (SpeechRecognition && !isIOS) {
        recognition = new SpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = false;
        recognition.lang = 'en-US';
    }

    var hasRecorder = navigator.mediaDevices && window.MediaRecorder;
    if (!recognition && !hasRecorder) {
        micBtn.disabled = true;
        micBtn.style.opacity = 0.3;
        micBtn.title = "Voice not supported in this browser";
    }

    var mediaRecorder = null;
    var audioChunks = [];
    var listening = false;
    var silenceCheckInterval = null;
    var silenceAudioCtx = null;

    function startListening() {
        if (listening) return;
        listening = true;
        setStatus('Listening...');
        micBtn.classList.add('listening');

        if (recognition) {
            recognition.onresult = function (event) {
                var question = event.results[0][0].transcript;
                askServer(question);
            };
            recognition.onerror = function (event) {
                setStatus("Didn't catch that (" + event.error + ') -- try again.');
                listening = false;
                micBtn.classList.remove('listening');
            };
            recognition.onend = function () {
                listening = false;
                micBtn.classList.remove('listening');
            };
            try { recognition.start(); } catch (e) { /* already started, ignore */ }
            return;
        }

        navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
            audioChunks = [];
            var mimeType = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm'
                : MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4' : '';
            mediaRecorder = mimeType ? new MediaRecorder(stream, { mimeType: mimeType }) : new MediaRecorder(stream);
            mediaRecorder.addEventListener('dataavailable', function (e) {
                if (e.data.size > 0) audioChunks.push(e.data);
            });
            mediaRecorder.addEventListener('stop', function () {
                stream.getTracks().forEach(function (t) { t.stop(); });
                micBtn.classList.remove('listening');
                stopSilenceWatch();
                if (audioChunks.length === 0) {
                    setStatus("Didn't catch that -- try again.");
                    listening = false;
                    return;
                }
                var blob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
                askServerWithAudio(blob);
                listening = false;
            });
            mediaRecorder.start();
            watchForSilence(stream);
        }).catch(function (err) {
            setStatus('Microphone access denied or unavailable (' + err.name + ').');
            listening = false;
            micBtn.classList.remove('listening');
        });
    }

    function watchForSilence(stream) {
        var AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        silenceAudioCtx = new AudioCtx();
        var source = silenceAudioCtx.createMediaStreamSource(stream);
        var analyser = silenceAudioCtx.createAnalyser();
        analyser.fftSize = 512;
        source.connect(analyser);
        var data = new Uint8Array(analyser.frequencyBinCount);

        var SILENCE_THRESHOLD = 8;
        var SILENCE_HOLD_MS = 1300;
        var MAX_DURATION_MS = 30000;
        var hasSpokenYet = false;
        var silenceStartedAt = null;
        var recordingStartedAt = Date.now();

        silenceCheckInterval = setInterval(function () {
            if (!mediaRecorder || mediaRecorder.state !== 'recording') return;
            analyser.getByteFrequencyData(data);
            var sum = 0;
            for (var i = 0; i < data.length; i++) sum += data[i];
            var avgVolume = sum / data.length;

            if (avgVolume > SILENCE_THRESHOLD) {
                hasSpokenYet = true;
                silenceStartedAt = null;
            } else if (hasSpokenYet) {
                if (silenceStartedAt === null) silenceStartedAt = Date.now();
                if (Date.now() - silenceStartedAt > SILENCE_HOLD_MS) {
                    stopListening();
                    return;
                }
            }
            if (Date.now() - recordingStartedAt > MAX_DURATION_MS) stopListening();
        }, 150);
    }
    function stopSilenceWatch() {
        if (silenceCheckInterval) { clearInterval(silenceCheckInterval); silenceCheckInterval = null; }
        if (silenceAudioCtx) { silenceAudioCtx.close().catch(function () {}); silenceAudioCtx = null; }
    }

    function stopListening() {
        if (!listening) return;
        if (recognition) { recognition.stop(); return; }
        if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
    }

    function toggleListening() {
        if (listening) stopListening();
        else startListening();
    }
    micBtn.addEventListener('click', function () { unlockSpeechIfNeeded(); toggleListening(); });

    resetBtn.addEventListener('click', function () {
        fetch('{{ url_for("assistant_reset") }}', {
            method: 'POST',
            headers: { 'X-CSRFToken': csrfToken }
        }).then(function () {
            resetBtn.style.display = 'none';
            setStatus('Started over.');
        });
    });
})();
</script>
{% endblock %}
